<div class="login-wrapper">

  <!-- Left Panel -->
  <div class="login-left">
    <div class="login-left-content">
      <div class="brand-mark">
        <i class="bi bi-bag-check-fill"></i>
      </div>
      <h1>ShopAdmin</h1>
      <p>Your all-in-one platform to manage products, orders, and inventory with ease.</p>

      <div class="feature-list">
        <div class="feature-item">
          <i class="bi bi-check-circle-fill"></i>
          <span>Real-time inventory tracking</span>
        </div>
        <div class="feature-item">
          <i class="bi bi-check-circle-fill"></i>
          <span>Order management & status updates</span>
        </div>
        <div class="feature-item">
          <i class="bi bi-check-circle-fill"></i>
          <span>Product catalogue with image uploads</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="login-right">
    <div class="login-form-wrapper">

      <div class="login-header">
        <h2>Welcome back</h2>
        <p>Sign in to your admin account</p>
      </div>

      <!-- Error -->
      <div class="alert alert-danger d-flex align-items-center gap-2" *ngIf="error">
        <i class="bi bi-exclamation-circle-fill"></i>
        <span>{{ error }}</span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label class="form-label">Email address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control"
                 [(ngModel)]="email"
                 placeholder="admin@example.com"
                 (keyup.enter)="login()">
        </div>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input [type]="showPassword ? 'text' : 'password'"
                 class="form-control"
                 [(ngModel)]="password"
                 placeholder="••••••••"
                 (keyup.enter)="login()">
          <button class="input-group-text toggle-pw"
                  type="button"
                  (click)="showPassword = !showPassword">
            <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
          </button>
        </div>
      </div>

      <!-- Submit -->
      <button class="btn btn-primary w-100 login-btn"
              (click)="login()" [disabled]="loading">
        <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
        <i *ngIf="!loading" class="bi bi-arrow-right-circle me-2"></i>
        {{ loading ? 'Signing in...' : 'Sign In' }}
      </button>

    </div>
  </div>

</div>
